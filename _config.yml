title: Solent DTS EPA Assessor Training
description: EPA Assessor Training
remote_theme: just-the-docs/just-the-docs
plugins:
- jekyll-remote-theme

# When commented out, callouts_level defaults to quiet for the light scheme, and loud for dark
# callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red